version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - revive
    - bodyclose
    - errorlint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # G204 (subprocess with variable/tainted args): every exec.Command call
      # in these six paths invokes a config-controlled binary (gpg, pass,
      # secret-tool, ethos, claude) with an explicit argument list -- never
      # shell=true, never attacker- or network-controlled input. Scoped to
      # these paths only; G204 stays fully active for the rest of the tree.
      - path: ^(internal/pgp|internal/secret|internal/testenv|internal/daemon|internal/daemontest|cmd/beadle-email)/
        linters:
          - gosec
        text: "G204"

formatters:
  enable:
    - gofumpt
    - goimports
