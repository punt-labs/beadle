prose: |
    Round 2 of beadle-tsku, fixing four findings from the silent-failure
    review of mission m-2026-10-23-002. Four commits on fix/worker-mcp-path,
    built on 95432ad:

    221400a fix(daemon): pass the daemon logger into MissionTemplate -- fix
    1/4 (HIGH): main.go now constructs MissionTemplate with Logger: logger,
    so BuildMCPConfig's "resolved mcp server command" line reaches
    beadle-daemon.log instead of slog.Default()'s stderr.

    4540aa6 fix(daemon): enforce absolute paths in BuildMCPConfig's
    resolution -- fix 2/4 (MEDIUM) and fix 4/4 (LOW): BuildMCPConfig now
    rejects a resolved Command that is not absolute (exec.LookPath returns
    a separator-bearing command like "./fake" verbatim once it confirms the
    file exists, never resolving it), naming the entry and the non-absolute
    result; the resolution-failure error text also now says whose PATH and
    what to do, matching runner.go's env-var style. Two new tests: a
    "./fake" case proven via t.Chdir (not a PATH change, so LookPath
    genuinely resolves it and only the new absolute-path check can reject
    it), and a two-entry registry (resolvable first, absent second) proving
    selected is built fully, with no file written, before any entry's
    resolution can fail partway through.

    3d44342 fix(daemon): build the MCP config before creating the stage
    mission, plus 204f4e9 docs(daemon): fold the MCP-ordering rationale into
    the existing comment -- fix 3/4 (MEDIUM): BuildMCPConfig now runs before
    createMissionFromContract in ClaudeRunner.Run, since it depends only on
    cmd.MCPServers and r.Registry; the existing comment above the env-var
    check (not a new block) was extended by one sentence to state this.
    fireElse's final reply-send failure (pipeline.go) is now logged at
    Error, matching its sibling permanent-failure lines a few lines above.
    TestClaudeRunner_MissingMCPBinaryCreatesNoMission proves the ordering
    against the real ethos CLI in an isolated $HOME/$ETHOS_REPO_ROOT: a
    stage with an unprovisioned MCP binary fails, and `ethos mission list
    --status all` in that isolated store is empty afterward. The test's
    Command carries a valid write_set/prompt/budget specifically so a
    regressed ordering would actually succeed in creating a real, listable
    mission -- verified by temporarily reverting the ordering and observing
    the test catch a real orphan mission before restoring.

    No fifth fix was folded in: no code-reviewer findings on round 1
    arrived before this submission.
