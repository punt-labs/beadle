prose: |
    Three commits on fix/ethos-mcp-serve, building on 06115c9:

    468bd71 chore(make): provision biff and beadle-email for make test
      - BIFF_VERSION := 1.19.0 pinned next to ETHOS_VERSION
      - tools-biff: uv tool install --force punt-biff==$(BIFF_VERSION)
      - tools-beadle-email: self-builds ./cmd/beadle-email into
        GOINSTALL_BIN (go build -o, not go install -- this repo's own
        code under test, not a published release)
      - UVTOOL_BIN := $(shell uv tool dir --bin) -- resolves to
        ~/.local/bin on this host, distinct from GOINSTALL_BIN
        (~/go/bin), so it needs its own PATH prefix
      - test: tools-ethos tools-biff tools-beadle-email, PATH extended
        with both GOINSTALL_BIN and UVTOOL_BIN

    28186a4 chore(ci): provision biff and beadle-email before the Test step
      - astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 #
        v10.3.0, the exact SHA+tag biff-notify.yml already pins
      - Install step runs all three make targets
      - GITHUB_PATH gains both GOPATH/bin and `uv tool dir --bin`
      - Fixed a shellcheck SC2005 finding (useless echo "$(cmd)") my
        first draft introduced by switching to printf for the Go path
        and a bare `uv tool dir --bin >> "$GITHUB_PATH"` for the uv one

    5befda6 docs(testing): document the three required tools, not just ethos
      - Expanded the single "ethos is a required tool" bullet to name
        all three, their pinning/build mechanism, and
        TestDefaultMCPRegistry_StdioCommandsAreReal as the consumer

    Demo: ran make test under a PATH scrubbed to /usr/bin:/bin plus
    GOROOT/bin plus a scratch directory containing only a symlink to the
    real uv binary (uv itself lives in ~/.local/bin on this host, the
    same directory `uv tool install` targets, so a shim was needed to
    make uv invocable while still excluding any pre-existing ethos/
    biff/beadle-email copies from the starting PATH). make test
    provisioned all three tools and passed every package. Separately ran
    TestDefaultMCPRegistry_StdioCommandsAreReal -v directly under the
    same scrubbed PATH, both with and without the GOINSTALL_BIN/
    UVTOOL_BIN prefix make test's PATH= line adds -- without it, all
    three subtests fail with the exact per-binary remedy text; with it,
    all three pass. Did not touch internal/daemon/templates_test.go.
    Scratch shim directory removed after the demo. Not pushed.
