    Three commits on fix/ethos-mcp-serve, building on e438ec6:

    3802f97 chore(make): close provisioning silent-failure gaps and the
    host-global race
      - tools-biff: fails loudly (uv absent -> install hint; `uv tool dir
        --bin` empty -> upgrade hint, the lint-shell
        `command -v X || { echo hint; exit 1; }` pattern) before
        attempting install; skips the install entirely when
        `uv tool list` already shows the pinned punt-biff version
        (idempotent -- the --force unlink-then-link window only opens on
        an actual version bump, not on every `make test`); kept --force
        with a comment stating what it overrides (a non-uv-installed biff
        already in the bin dir) now that the pin+skip-check is what
        actually drives reinstall on version drift
      - BEADLE_EMAIL_BIN := $(CURDIR)/.tmp/bin -- new per-checkout
        variable; tools-beadle-email now builds into it instead of
        GOINSTALL_BIN. $(CURDIR), not a bare relative path, because `go
        test` chdirs each package's test binary into that package's own
        source directory, and a relative PATH entry would resolve
        against the wrong directory inside the test subprocess.
        GOINSTALL_BIN keeps its original job (ethos only) and its
        host-global sharing is still sound there, since every concurrent
        `go install` of the pinned ethos version writes identical bytes;
        the comment above it is rewritten to say so explicitly and to
        retract the old "exactly one PATH prefix" argument, which held
        only while both tools shared one directory
      - test recipe's PATH: $(if $(UVTOOL_BIN),$(UVTOOL_BIN):,) so a
        missing UVTOOL_BIN is omitted from PATH rather than spliced in as
        an empty component (which both the shell and exec.LookPath treat
        as cwd) -- defense in depth now that tools-biff's own recipe
        already fails before `test`'s PATH= line is ever constructed via
        the normal `make test` entry point

    5ab07c0 chore(ci): add the per-checkout bin dir to GITHUB_PATH
      - $GITHUB_WORKSPACE/.tmp/bin prepended to GITHUB_PATH alongside the
        existing GOPATH/bin and uv tool bin dir entries, matching
        BEADLE_EMAIL_BIN's new per-checkout home
      - fixed an SC2129 shellcheck finding (actionlint catches it)
        introduced by the three-redirect PATH step: grouped into one
        `{ ... } >> "$GITHUB_PATH"` block

    8e85152 docs(testing): document the host-global vs per-checkout
    provisioning split
      - states explicitly that tools-ethos/tools-biff still write to
        shared, host-global directories (safe because both are
        version-pinned -- concurrent installs write identical bytes) and
        that this is NOT true of tools-beadle-email, whose content is
        per-branch
      - restates the "runs identically" caveat: holds through `make
        test`/`make check` only -- a bare `go test ./...` has no
        `.tmp/bin` on PATH and falls back to whatever `beadle-email` the
        shell's own PATH resolves first
      - names the one remaining race honestly: a version-pin bump on
        tools-ethos or tools-biff racing a concurrent `make test` on the
        same host can still interleave; tools-beadle-email's per-checkout
        directory is immune by construction

