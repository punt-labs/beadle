prose: |
    File hash (sha256) at submission: Makefile 76a2b3ff2f3552d8d36d827dd32e45b5262afa83f774c9dd4027c69e6c59f03c

    One commit on fix/ethos-mcp-serve, building on 8e85152:

    717f046 chore(make): require an executable biff for the skip, surface
    uv's real error

    tools-biff's skip check now requires BOTH `test -x
    "$(UVTOOL_BIN)/biff"` and the pinned version in `uv tool list`
    (grep -qFx, -F so the version dots are literal, not a regex
    wildcard), so a pinned-but-unlinked biff reinstalls instead of
    printing "already installed, skipping" from the exact target the
    registry test's remedy names. An editable or path-installed
    punt-biff at the pin still satisfies the check (uv's listing names
    the version regardless of source), noted in the comment above the
    recipe, so a developer's own editable checkout is preserved rather
    than clobbered.

    The UVTOOL_BIN-empty failure branch no longer asserts "too old to
    support --bin" as the only explanation from a suppressed probe: it
    now re-runs `uv tool dir --bin` unsuppressed before exiting, so
    whatever uv actually printed (a parse error, a missing HOME, an
    unrecognized flag on a genuinely old uv) reaches the developer
    directly, with the version-mismatch guess demoted to a fallback line
    for the case where uv prints nothing at all.

    Inside the reinstall branch, `uv tool list` is now also checked
    un-suppressed for its own exit status (output still discarded, since
    the grep above already consumed the real check) and a one-line note
    is printed when it fails, so the race guard's "else install" path is
    visibly a deliberate fallback rather than a silent one.

    All six tools-biff echo/printf lines go to stderr, matching the
    `>&2` pattern already used throughout the prfaq recipe elsewhere in
    this Makefile.

    Demo: all fidelity work ran against isolated UV_TOOL_DIR and
    UV_TOOL_BIN_DIR under
    [REDACTED:path]/.tmp/mission037-scratch/ (uv
    honors both env vars, confirmed with `uv tool dir`/`uv tool dir
    --bin` before relying on them) -- the host's real ~/.local/bin/biff
    install was never unlinked, reinstalled, or otherwise touched during
    any fidelity run; `make test` against the normal host PATH at the
    end still showed the ordinary skip line. Old-uv and uv-tool-list-
    failure shims built under the same scratch directory, never in the
    tree; scratch directory and all .tmp/bin build artifacts removed
    after use. `git status --short` clean before the commit and clean
    now. Did not touch any file outside the Makefile write set. Not
    pushed; no PR or merge touched; no further commit after this
    submission.
