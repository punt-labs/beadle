prose: |
    This mission records work already committed as 80366ce and 06115c9
    on fix/ethos-mcp-serve, per its own success criteria: no new code.
    It exists to cover admin_cmd_test.go, the file m-2026-10-22-025's
    write set omitted (that mission closed failed on an escalate at
    exactly this gap, a contract defect on the leader's side, not a
    worker error).

    Commit 80366ce (test(daemon), internal/daemon/templates_test.go)
    addresses all five silent-failure findings on
    TestDefaultMCPRegistry_StdioCommandsAreReal:

    1. Usage-line requirement. Measured directly on this host:
       `echo -n "" | timeout 2 ethos serve --help` and
       `echo -n "" | timeout 2 beadle-email serve --help` both exit 0 --
       neither binary special-cases --help in its RunE, so cobra parses
       the flag and falls through to the server body, which returns nil
       once its stdin pipe (CombinedOutput's pipe) reaches EOF. Exit 0
       alone therefore cannot distinguish "printed usage and exited"
       from "started the server." Added
       `strings.Contains(strings.ToLower(string(out)), "usage")` as a
       second requirement. Verified this specifically catches the gap:
       built a disposable `fakeserver` script that reads stdin to EOF
       and exits 0 with no output, confirmed the usage check flags it
       (built under /tmp for the proof only, not committed).

    2. Timeout misread as crash. ctx.Err() is now checked immediately
       after CombinedOutput returns, before the *exec.ExitError branch,
       and fails with a message naming the 5s deadline and that --help
       may have started the server. Verified against a disposable Go
       binary that sleeps 100s after reading stdin: with a 1s timeout,
       ctx.Err() reports "context deadline exceeded" while the
       underlying CombinedOutput error is "signal: killed" (what the
       original code would have read as an *exec.ExitError with
       ExitCode() -1, i.e. "exited -1") -- confirming the new check
       intercepts that case before it reaches the exit-code branch.

    3. Vacuous skip / wrong skip justification. cfg.Validate() is now
       called on every entry BEFORE the `cfg.Command == ""` skip, so a
       typo'd {} entry (also Command == "") fails loudly via Validate
       instead of silently matching the http-entry skip. The skip's
       comment now says "Validate above confirmed this is a deliberate
       http shape," not just "nothing to exec."

    4. Vacuous pass. The loop now counts `exercised` stdio entries and
       the test ends with
       `require.Greater(t, exercised, 0, ...)` so an all-http or
       emptied registry fails loudly instead of reporting PASS with
       zero subtests.

    5. Ethos-only install remedy. Replaced the inline ethos-specific
       sentence with `mcpCommandInstallRemedy(cmd)`, a small switch
       naming the actual Makefile target per binary: tools-ethos,
       tools-beadle-email (noted as a self-build of ./cmd/beadle-email),
       tools-biff. Per the contract, those two new Makefile targets and
       their CI wiring are explicitly NOT in this mission -- did not
       touch templates.go, any Makefile, or any CI file.

    Required -v output showing three subtests ran:

      === RUN   TestDefaultMCPRegistry_StdioCommandsAreReal
