    Commit 06115c9 (fix(beadle-email), admin_cmd.go + admin_cmd_test.go)
    adds Args: cobra.NoArgs to serveCmd. Measured `beadle-email serve
    bogus` on this host before the fix: it silently started the real
    MCP server (IMAP poll tick logged) and exited 0 on stdin EOF, unlike
    `ethos serve bogus` ("unknown command", exit 2) and `biff mcp bogus`
    ("Got unexpected extra argument(s)", exit 2). Confirmed via cobra's
    own source (command.go's execute: ValidateArgs at line 968 runs
    before RunE at line 1014) that the rejection happens before any IMAP
    dial or network I/O. Added TestServeCmd_RejectsStrayPositional in
    admin_cmd_test.go, driven through the real rootCmd.Execute() entry
    point via the existing runRootCmd helper (not a bespoke SetArgs
    dance), asserting a non-nil error containing "bogus". This is the
    file this mission's write set now covers that m-2026-10-22-025's did
    not.

    templates_test.go documents (per the contract) that a wrong TRAILING
    positional on a command like `ethos serve bogus --help` would still
    pass under --help on all three binaries, since both cobra and click
    resolve --help before arg validation; this guards the
    leading-subcommand shape only, which is exactly the shape the
    original defect (ethos mcp) had.

    No new code in this mission, as its own criterion requires -- both
    commits (80366ce, 06115c9) predate this mission's creation.

