prose: |
    Two commits, in the order the contract specified.

    Commit 1 (e410aa1, internal/daemon/harness_test.go): fixed
    TestOnNewMail_EndToEnd's persistence-assertion discriminator per the
    invariant review of b6981f3. Executor.Run (pipeline.go) saves a
    "running" record BEFORE planning or spawning, so a record on disk
    means gates 1 and 2 passed, not that the spawner was called -- the
    old `wantSpawnerCalls > 0` branch would have broken on a future
    gate-3/4 negative row (message accepted, spawner never called,
    pipeline ends "failed"). Added a `wantRecordStatus string` column:
    "" means no record expected, any other value is the expected
    Pipeline.Status. The positive row is "completed"; both gate-1/2
    negatives are "". The disk assertion now branches on this column.
    Also changed `assert.Len(t, calls, ...)` to `require.Len` on the
    spawner-call-count check, so a spawner-count mismatch on the
    positive row reports that failure instead of panicking on
    `calls[0]` with an index-out-of-range. The comment above the disk
    assertion is 7 lines (under the 8-line limit) and states the real
    non-vacuity reason (fresh t.TempDir per subtest, the can-fail proof)
    and what the negative rows buy (attribution to gates 1/2, not the
    spawner), with no "when no pipeline ran" phrasing.

    Re-verified the can-fail proof from b6981f3 still holds against the
    reshaped discriminator: temporarily removed `Store:  h.store,` from
    handler.go's Executor literal (outside this mission's write set),
    confirmed the positive subtest failed identically
    ("[] should have 1 item(s), but has 0" / "exactly one pipeline
    record expected on disk" at harness_test.go:188), restored
    handler.go with git checkout, confirmed git status clean before
    committing.

    go test -race -count=1 -run TestOnNewMail_EndToEnd -v
