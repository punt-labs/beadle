    Commit 2 (950a5f3, internal/daemon/templates_test.go): closed the
    three review findings on TestDefaultMCPRegistry_StdioCommandsAreReal
    from a second silent-failure pass on 80366ce.

    (a) mcpCommandInstallRemedy's signature changed to
    (remedy string, known bool) with NO default arm. The test
    require.True's the bool before LookPath, so a registry entry naming
    a command with no provisioning story fails outright with a message
    naming the exact gap: add a tools-<cmd> Makefile target, wire it
    into CI, and add a remedy case. Verified ad hoc (not committed):
    mcpCommandInstallRemedy("totally-unknown-binary") returns
    known=false.

    (b) The usage check now requires the literal case-sensitive
    "Usage:" AND the configured command line (cfg.Command plus Args,
    space-joined) in the output, so a binary printing its ROOT usage on
    an unrecognized subcommand (also exiting 0, also containing the
    word) no longer passes -- the pass is tied to the SPECIFIC
    subcommand this entry names. Proved with a disposable fake binary
    (/tmp/mcp-probe-bin/rootusage, not committed) that prints
    "Usage: rootusage [command]" with no subcommand text and exits 0:

      zzz_probe_test.go:30: CORRECTLY DETECTED: root usage printed, command line "/tmp/mcp-probe-bin/rootusage serve" absent -- would fail the real check:
          Usage: rootusage [command]

          Commands:
            foo   do foo

    (c) cmd.WaitDelay = time.Second is now set on the exec.Cmd, so a
    started server that forks a child holding the pipes (a daemon's
    double-fork, or any grandchild inheriting stdout/stderr) cannot
    block CombinedOutput past the context deadline -- WaitDelay bounds
    how long Wait keeps reading once the context is done. Proved with a
    disposable Go binary (/tmp/mcp-probe-bin/forksleep, not committed)
    that reads stdin, forks `sleep 30` with inherited stdout, then
    exits: confirmed separately that WITHOUT WaitDelay, CombinedOutput
    blocks past the 5s context deadline entirely (the process never
    returned; killed manually after 20s+). WITH WaitDelay=1s:

      zzz_probe_test.go:18: elapsed=1.002797954s ctx.Err()=<nil> err=exec: WaitDelay expired before I/O complete
      zzz_probe_test.go:22: CORRECTLY BOUNDED: returned in 1.002797954s (WaitDelay=1s after parent exit), well under the forked sleep 30's duration and the 5s context deadline

    Separately confirmed this WaitDelay-expiry error is NOT an
    *exec.ExitError (errors.AsType[*exec.ExitError] returns ok=false for
    it), so it correctly falls through to the test's existing generic
    error t.Fatalf branch rather than being misread via an exit code --
    no change needed to that branch.

