prose: |
    handler.go's OnNewMail builds its Executor with `Store: h.store`, but
    TestOnNewMail_EndToEnd passed nil for the store argument to
    NewMailHandler, so that field's effect was never asserted -- a
    refactor dropping it would have left the suite green.

    Changed the positive/negative table-driven test's shared body (all
    three subtests share one NewMailHandler call site at line ~150) to
    construct a real *daemon.PipelineStore on a t.TempDir() and pass it
    instead of nil. After handler.Stop(), read the store directory:

      - Positive case (all four gates pass): asserts exactly one
        <id>.json file exists, unmarshals it, and asserts Status
        "completed" and Email.From == "jim@punt-labs.com" -- the pattern
        in persist_test.go's TestExecutor_Run_PersistsToDisk.
      - Negative cases (gate 1: unsigned message; gate 2: rw- sender):
        assert the store directory is EMPTY, so the persistence
        assertion is tied to the pipeline having actually run and
        cannot pass vacuously.

    Can-fail proof (per the contract): temporarily removed the line
    `Store:  h.store,` from the Executor literal in
    internal/daemon/handler.go's OnNewMail (handler.go is NOT in this
    mission's write set), ran the test, and confirmed the positive case
    failed:

      harness_test.go:172:
          Error:      "[]" should have 1 item(s), but has 0
          Test:       TestOnNewMail_EndToEnd/all_four_gates_pass:...
          Messages:   exactly one pipeline record expected on disk

    The two negative subtests still passed (they expect an empty
    directory regardless), confirming the new assertion is specifically
    tied to the positive case's pipeline run, not just checking "some
    file exists anywhere."  Restored handler.go with
    `git checkout -- internal/daemon/handler.go` and confirmed
    `git status --short` showed it clean before committing. Re-ran the
    test with handler.go restored: green again.

    One commit, write-set only:
