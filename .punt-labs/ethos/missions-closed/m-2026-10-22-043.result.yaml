prose: |
    File hash (sha256) at submission: Makefile 9f370a7507af2f88a9d42bb59d741be62aa9a7a5613769436c949c754a0d99e4

    One commit on fix/ethos-mcp-serve, building on 06fb7a8:

    23d283d chore(make): never redirect uv's stderr in tools-biff

    Rounds 6 and 7 each found the same class of defect on a different
    row: a uv call's stderr captured into a shared temp file and left
    unread somewhere. A third passthrough line on round 7's surviving
    row (`uv tool list`, rows 3/4b/4c) would have been the same move a
    third time. This round removes the mechanism that made the class
    possible rather than patching its next instance: tools-biff no
    longer redirects stderr on any uv call. `bin=$$(uv tool dir --bin)`
    and `listing=$$(uv tool list)` capture stdout only; uv's own
    diagnostics reach the terminal directly, in the order uv wrote them,
    always before this recipe's own message about the same call. The
    temp file, the mktemp guard and its table row, the EXIT trap, and
    the round-7 stderr-passthrough line are all deleted -- about ten
    lines net, and a whole category of "has this row read the file yet"
    question with them.

    Row 2's and row 4a's failure messages now quote the captured STDOUT
    (which can still be informative -- e.g. a stray partial path before
    an error, or empty) and say "see uv's message above", pointing the
    reader at the diagnostic uv already printed directly rather than
    re-presenting a copy of it. Rows 3/4b/4c are unchanged in substance:
    they classify on the captured stdout listing alone, never on
    stderr, which is what actually prevents a uv warning mentioning
    "punt-biff " from being misread as the installed version -- that
    protection came from the stdout/stderr separation, which this
    change keeps, not from the temp file, which it removes. Fidelity
    (d) demonstrates this directly: a stderr warning containing
    "punt-biff " still correctly falls through to row 4c, not 4b.

    The preamble's old "never discarded" sentence required re-checking
    against every row on every subsequent round (and was wrong twice).
    It is replaced with the single invariant that makes the question
    moot: stderr is never redirected in this recipe, so there is
    nothing for any row to discard in the first place. The `test`
    recipe's resolver keeps its round-6/7 shape (it already left stderr
    unredirected -- there was never a bug there to fix for THIS class)
    and now quotes its own captured stdout the same way row 2 does.

    Demo: all fidelity work ran against isolated
    UV_TOOL_DIR/UV_TOOL_BIN_DIR under
    [REDACTED:path]/.tmp/mission043-scratch/; the
    host's real ~/.local/bin/biff install was never touched, confirmed
    by stdout/stderr captured separately on every run (host runs showed
    only the ordinary skip line) and by the final `make test` against
    the normal host PATH still showing it. All shims removed after use;
    `git status --short` clean before the commit and clean now. Did not
    touch any file outside the Makefile write set. Not pushed; no PR or
    merge touched; no further commit after this submission.

    Note on lint-strict: the known worktree artifact (six gosec G204
    findings, confined to internal/pgp and internal/secret, caused by
    the exclusion regex not matching the ../../../-prefixed paths
    golangci-lint reports from inside a worktree) reproduced on every
    run, but the SPECIFIC six lines shifted slightly between two
    consecutive runs in this session -- always six, always within the
    same two pre-excluded directories. This is new information about
    the artifact's own non-determinism, not a regression this change
    introduced; the Makefile touches no Go source and is not itself a
    golangci-lint target.
