prose: |
    File hash (sha256) at submission: Makefile 8a88afe6b3949b52cbdf60646d5fe2bb926205d84020786ba82e92b60b08b2b9

    One commit on fix/ethos-mcp-serve, building on 3735f61:

    8f3873b chore(make): restructure tools-biff into enumerable checks
    with an outcome table

    Four rounds had each fixed the previous round's diagnostic wording
    and opened a narrower one on the same two lines, because the
    approach -- merging or discarding stdout/stderr ad hoc -- had no way
    to represent "succeeded with a stderr warning" and "failed silently"
    as genuinely distinct, enumerable cases. This round replaces that
    with five numbered checks, documented in a comment table directly
    above the recipe so a reviewer checks table rows rather than
    re-deriving the shape from prose:

    1. uv on PATH -- unchanged from prior rounds.
    2. The bin directory is resolved FRESH at recipe time with
       `bin=$(uv tool dir --bin 2>"$err")`, capturing stdout into a
       variable and stderr into a mktemp file kept open only for this
       recipe invocation (`trap 'rm -f "$err"' EXIT`). Classification is
       exit status AND non-empty stdout together -- not either alone --
       so a probe that warns on stderr but returns a real path on stdout
       with exit 0 proceeds normally (the round-4 regression this round
       fixes), while a probe that exits 0 with nothing on stdout still
       fails and shows whatever it wrote to stderr (the gap merging
       stdout+stderr previously papered over). This resolved value,
       `$bin`, is used for every check below it in this recipe; the
       parse-time `$(UVTOOL_BIN)` variable is no longer read inside
       tools-biff at all (it is retained, unchanged, for the `test`
       target's own PATH= line, which still needs a value computed once
       at parse time for its PATH prefix).
    3. The skip decision now also requires `uv tool list` to have
       exited cleanly, in addition to the existing entrypoint-executable
       and exact-pin-match conditions from round 2.
    4. On reinstall, exactly one of three reason lines, in a fixed
       evaluation order: list failure (quoting the captured list output
       and its exit status) outranks version mismatch, which outranks
       entrypoint-missing-with-pin-listed -- the same ordering fixed in
       round 4 to avoid a from-scratch install falsely claiming the pin
       was listed, now restated against the restructured capture.
    5. Install remains the final command in the else branch, so its own
       exit status is still the recipe's.

    No `2>/dev/null` appears anywhere in tools-biff now (confirmed by
    grep). The round-4 "re-run make" wording and its parse-time retry
    are both gone: since check 2 now runs live at recipe time rather
    than consulting a parse-time snapshot, a transient failure that
    would have shown up at `make`'s parse step simply isn't visible to
    this recipe at all -- whatever `uv tool dir --bin` returns when the
    recipe actually executes IS the answer, with nothing stale to retry.

    Demo: all isolated-directory fidelity work ran against
    UV_TOOL_DIR/UV_TOOL_BIN_DIR under
    [REDACTED:path]/.tmp/mission039-scratch/; the
    host's real ~/.local/bin/biff install was never unlinked,
    reinstalled, or otherwise touched -- confirmed both by inspection
    and by the final `make test` against the normal host PATH still
    showing the ordinary skip line. The version-mismatch shim (row 4b)
    again used a synthetic `tool list` line (no second real biff release
    reachable offline, as noted in round 4) while delegating every other
    uv subcommand, including the real `tool install`, to the actual uv
    binary. All shims and the isolated uv dirs removed after use;
    `git status --short` clean before the commit and clean now. Did not
    touch any file outside the Makefile write set. Not pushed; no PR or
    merge touched; no further commit after this submission.
