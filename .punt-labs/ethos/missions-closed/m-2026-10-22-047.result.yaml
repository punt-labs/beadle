prose: |
    Round 3 on bead beadle-fbhp. 045 closed at its cap: the evaluator
    passed it and the invariant re-review closed all four round-2
    findings, then found two new MEDIUMs on mcpCommandPath. One
    commit, write set templates_test.go only, build on 1b9d4a2.

    (A) A registry entry whose Args leads with a persistent flag
    (cobra and click both accept `ethos --json serve`) made
    mcpCommandPath's stop-at-first-dash rule return the bare command,
    silently degrading the usage check to "Usage:" plus the binary
    name -- exactly what a CLI's root usage satisfies. Fixed
    structurally, not by teaching the helper to parse around it: added
    `require.False(t, len(cfg.Args) > 0 && strings.HasPrefix(cfg.Args[0], "-"), ...)`
    as the subtest's next statement after the provisioning-story gate,
    naming the rule (stdio entries lead with the subcommand, flags
    follow it). mcpCommandPath's own stop-at-first-dash rule is
    unchanged. TestMCPCommandPath gained the two required rows:
    {"--json","serve"} -> "ethos" (the degenerate case, documented as
    such) and {"mission","show"} -> "ethos mission show" (the
    two-element run).

    Proved per the contract: temporarily added
    {Command: "ethos", Args: ["--json", "serve"]} to
    DefaultMCPRegistry in templates.go. The new require.False failed:

      templates_test.go:227:
          Error:      Should be false
          Messages:   registry entry "probe-leading-flag": Args [--json serve]
                      leads with a flag -- stdio entries must lead with the
                      subcommand, with any flags following it (both cobra and
                      click accept that order)

    Reverted templates.go with git checkout; git diff --stat produced
    no output (confirmed empty).

    (B) The usage check matched cfg.Command+Args as a substring of the
    WHOLE --help output, so a CLI's root usage whose description prose
    mentions a real subcommand name (e.g. "Available Commands:\n  serve
    Start the ... serve server") would satisfy it without the named
    entry's own help ever having run -- biff's exclusion today held
    only by the accident that its description capitalizes "MCP". Added
    usageLine(out string) string: returns the first line containing
    "Usage:" joined with the next non-blank line (cobra prints the path
    on the following line; click on the same line -- the join covers
    both). The check now requires cmdPath within usageLine's result,
    not the whole output. Added TestUsageLine, table-testing the helper
    with exactly the three sample shapes the contract specified:
    cobra-shaped, click-shaped, and prose-only (which must NOT match).

    Proved per the contract: registered a temporary fake binary
    (/tmp/mcp-probe-bin/fakeroot) printing precisely the root-usage
    shape specified -- "Usage:\n  fakeroot [command]\n\nAvailable
    Commands:\n  serve  Start the fakeroot serve server" -- as a
    temporary stdio entry {Command: "/tmp/mcp-probe-bin/fakeroot",
    Args: ["serve"]} with a temporary remedy case. Confirmed the OLD
    substring check would have passed it: `grep -c "fakeroot serve"`
    against the real --help output returns 1 (the text is present, in
    the prose). The NEW anchored check failed it:

      templates_test.go:263: registry entry "probe-fakeroot":
          /tmp/mcp-probe-bin/fakeroot serve --help exited 0, but its usage
          line "Usage:   fakeroot [command]" did not mention
          "/tmp/mcp-probe-bin/fakeroot serve" -- this may be ROOT usage
          from an unrecognized subcommand (the full output may still
          mention "/tmp/mcp-probe-bin/fakeroot serve" in description
          prose further down, which does not count)

    Reverted templates.go (git checkout) and removed the temporary
    remedy case from templates_test.go before committing; git diff
    --stat on templates.go produced no output both times this was
    checked (after the finding-B probe and again after the finding-A
    probe).

    Also removed the WaitDelay comment's implication that "the scenario
    actually verified here" referred to a committed test -- it now
    states the double-fork scenario parenthetically as a fact about the
    fake binary used during review, explicitly "not a committed test."

    Combined run, go test ./internal/daemon/... -run
    'TestDefaultMCPRegistry_StdioCommandsAreReal|TestMCPCommandPath|TestUsageLine'
    -v: all pass, including all three real subtests (ethos,
    beadle-email, biff) against the anchored usage-line check and all
    six TestMCPCommandPath rows and all three TestUsageLine rows.
    go test -race -count=1 ./internal/daemon/ is green.

