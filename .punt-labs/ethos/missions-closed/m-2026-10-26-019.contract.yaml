success_criteria:
    - The shared mutable Pipeline.PipeTruncated field is removed. Runner.Run returns its own truncation state with its output, as (output string, truncated bool, err error) or a small result struct; CLIRunner's runOutput and runCompound report true at their 1MB cap and never append truncationMarker; ClaudeRunner reports false. Every implementor in the write set (CLIRunner, ClaudeRunner, mockClaudeRunner in pipeline_edge_test.go, any runner fake in runner_test.go) and every caller is updated; go build ./... and go vet ./... are clean.
    - Executor.Run carries pipeTruncated as a local alongside pipe and assigns it only where pipe = result is assigned; a passthrough stage leaves both unchanged. StagePayload.PipelineOutputTruncated is populated from that local via the runner call, never from a Pipeline field. fireElse passes false for its fixed else-pipe string; the auto-reply stage passes the carried local for the final pipe. The Pipeline doc comments and the StagePayload doc comment describe this and no longer mention a reset.
    - 'Three regression tests through the real Executor.Run stage loop, in pipeline_test.go or pipeline_edge_test.go: a CLI stage whose stdout hits the cap followed by a claude stage, asserting the claude stage''s StagePayload shows PipelineOutputTruncated true and its fence header says truncated; a CLI stage whose capped output fails output validation, asserting fireElse''s reply stage sees false; a passthrough CLI stage with capped output followed by a process stage, asserting the next stage sees the state of the unchanged pipe. The overlay at .tmp/sfh-r3-pipetruncated-overlay_test.go is the starting point for the first two; delete the overlay file after promoting it. TestCLIRunner_OutputCap and _CompoundOutputCap are adapted to assert on the returned state.'
    - make check is green from the worktree after each commit (worktree-only gosec G204 artifact with ../ or .claude/worktrees/ paths excepted; nothing else). Test count does not go down. Commits are one logical step each, fix(daemon) or test(daemon), staged by file name. No t.Skip, no nolint. Do not push, do not touch PRs or merge; the leader does that. Do not commit after submitting.
