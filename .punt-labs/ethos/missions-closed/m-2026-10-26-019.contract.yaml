context: |
    Successor to m-2026-10-26-014, which closed failed at a write-set
    boundary (pipeline_edge_test.go implements and calls Runner.Run and was
    omitted from that contract), not on substance. Bead beadle-4gm1, branch
    fix/email-payload-off-contract, worktree [leader message has the path],
    HEAD 3ffbed7, with the worker's uncommitted runner.go edits from the
    prior round already in the tree; continue from them. The defect, found
    independently by djb and the silent-failure hunter: pipeline.go resets
    p.PipeTruncated at the top of stage i before ClaudeRunner.Run in the
    same iteration reads it, so a CLI stage i-1 that hit the cap sets true
    and the reset wipes it before the only reader sees it; the fence then
    says nothing over a cut value. The reverse holds on fireElse, which
    passes a fixed string while the flag is still true. Design rule, a
    leader decision: truncation state travels with the value it describes,
    returned by the runner that produced it and carried by the executor as
    a local; there is no field to reset. daemontest is outside the write
    set; if a fake there must change, stop and report. make test
    provisions tools itself; scratch under the worktree's .tmp/ only; one
    commit per logical step, each green.
