prose: |
    Addressed all five round-2 findings from djb's evaluation plus the
    leader's two items:

    1. HIGH, isEmpty gate removed. StagePayload and
       BuildSystemPromptForTools doc comments corrected: the empty path is
       now attributed to BuildSystemPrompt and direct test calls only, not
       handler.go (which never called either function). BuildSystemPrompt
       itself kept, since TestBuildSystemPromptNilToolsOmitsBashDependentResult
       still exercises it; its doc comment says so explicitly.
       TestBuildSystemPromptForTools_EmptyPayloadOmitsStageInput rewritten
       to assert the STAGE INPUT block and all three "(none)" markers are
       present, with no fence.

    2. HIGH, vacuous test replaced. Deleted
       TestBuildStageContract_ContextCarriesNoPayload (pipeline_test.go);
       added TestClaudeRunner_ContractCarriesNoPayload (runner_test.go),
       which drives ClaudeRunner.Run against the real ethos CLI and reads
       the actual stored contract.yaml from
       $ETHOS_REPO_ROOT/.punt-labs/ethos/missions/<id>/. Fixture body's
       embedded address and secret-shaped token sit inside the first 200
       runes; the call carries a distinctive arg value and pipe value.
       Asserts the whole document except inputs.trigger contains none of
       the payload components or meta.From, and that inputs.trigger.from
       round-trips to meta.From. I verified this test actually catches a
       regression: I temporarily patched buildStageContract to write the
       payload into context, confirmed every assertion failed with the
       expected messages, then reverted (clean diff afterward, confirmed
       with git diff).

    3. MEDIUM, fencing. stagePayloadText now wraps each non-empty field in
       "--- begin <name>: N runes[, state] ---" / "--- end <name> ---";
       "(none)" appears only outside any fence. Sorted-args and capping
       behavior preserved. All TestStagePayloadText* tests rewritten
       against a wantFence test helper that mirrors fenceField's exact
       shape.

    4. MEDIUM, normalization. New sanitizeText (NUL strip +
       strings.ToValidUTF8) runs before capRunes inside fenceField for
       every capped field, so under-cap and over-cap values are sanitized
       identically; the fence names "sanitized" when it fired, "truncated"
       when capping fired, both when both fired. New table test
       TestStagePayloadText_SanitizesNULAndInvalidUTF8 covers a NUL byte
       and an invalid UTF-8 sequence at both lengths, computing expected
       output from sanitizeText/capRunes themselves rather than
       hand-written strings.

    5. MEDIUM, stale doc comment. Pipeline.Body's comment now points at
       stagePayloadText and BuildSystemPromptForTools instead of
       buildStageContract/the mission contract.

    Kept TestClaudeRunner_PayloadReachesSystemPromptNotContract and the
    harness assertion unchanged in substance (only updated their
    fence-aware content assertions where the format changed), per the
    leader's confirmation both are non-vacuous.

    Four commits, each make check green (worktree G204 exception only):
    5b67324 (findings 1/3/4/5), b91b584 (finding 2).
