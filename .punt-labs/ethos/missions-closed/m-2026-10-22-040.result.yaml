prose: |
    File hash (sha256) at submission: Makefile ccfb77e31f4699e4f43570e2560a45014a5907fb9b1645c2c22f15e32caacf4a

    One commit on fix/ethos-mcp-serve, building on 8f3873b:

    8c5e704 chore(make): fix tools-biff's list capture, mktemp failure,
    and the test target's stale PATH

    Fix 1 (list capture): `listing=$$(uv tool list 2>&1)` is now
    `listing=$$(uv tool list 2>"$$err")`, reusing the same temp file
    check 2 already created -- stdout alone feeds rows 3/4b/4c's
    classification (the entrypoint check, the version-match check, the
    `grep -F 'punt-biff '` that extracts the installed line), so a uv
    warning on stderr that happens to contain the string "punt-biff "
    can no longer be misread as the installed version. Row 4a, the one
    row that reports on the list call's own failure, now quotes both
    `$$listing` (stdout) and `$(cat "$$err")` (stderr) in its message,
    matching the table's "<captured stdout and stderr>" text.

    Fix 2 (mktemp failure): `err=$$(mktemp)` gained `|| { echo
    "tools-biff: mktemp failed (check TMPDIR)" >&2; exit 1; }`, placed
    BEFORE `trap ... EXIT` is set (nothing to clean up if mktemp itself
    never created anything). A new table row documents this as its own
    outcome, distinct from a uv failure.

    Fix 3 (test target's stale PATH): the parse-time `UVTOOL_BIN :=
    $(shell uv tool dir --bin 2>/dev/null)` variable is deleted along
    with its comment block. `grep -n UVTOOL_BIN Makefile` confirms zero
    remaining references. `test`'s own recipe now resolves the uv bin
    dir itself, independently, at the point it runs: `uvbin=$$(uv tool
    dir --bin)`, failing loudly with a specific message if that comes
    back empty, rather than trusting a value `make` captured once when
    it first read this file -- before tools-biff had even run, and with
    no way to recover if that one-time call happened to fail
    transiently. This was the actual mechanism behind the "re-run make"
    case round 4 patched and round 5 removed: round 5 made tools-biff's
    OWN bin-dir check recipe-time-fresh, but `test` was still reading
    the OLD parse-time snapshot for its unrelated PATH-building purpose,
    so the exact failure mode could still surface there, just
    relabeled as "biff not found" in the registry test rather than a
    tools-biff diagnostic.

    Table-text fixes: the preamble no longer claims the rows are
    mutually exclusive, since a state can satisfy both 4b's and 4c's
    conditions at once (list exits 0, version happens to differ, AND
    entrypoint happens to be missing) -- it now states the fixed
    evaluation order (4a, then 4b, then 4c) as the tiebreaker, matching
    what the if/elif chain already enforced. Row 3's condition gained
    "AND `uv tool list` exits 0", which the shell already required but
    the table previously omitted.

    Demo: fidelity (a) and (b) ran against isolated
    UV_TOOL_DIR/UV_TOOL_BIN_DIR under
    [REDACTED:path]/.tmp/mission040-scratch/; the
    host's real ~/.local/bin/biff install was never touched, confirmed
    by the final `make test` against the normal host PATH still showing
    the ordinary skip line. Fidelity (c) used a real scrubbed PATH
    (/usr/local/go/bin:/usr/bin:/bin plus only the counter-shim
    directory, via env -i) because the scenario is specifically about
    `make test`'s own PATH-resolution step, not tools-biff's isolated
    install state -- reusing the host's real uv/ethos/go-bin directories
    for everything downstream of the simulated first failure. All shims
    and the isolated uv dir removed after use; `git status --short`
    clean before the commit and clean now. Did not touch any file
    outside the Makefile write set. Not pushed; no PR or merge touched;
    no further commit after this submission.
