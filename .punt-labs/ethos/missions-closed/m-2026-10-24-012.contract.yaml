success_criteria:
    - 'Implement approach A of docs/email-payload-handoff.md exactly: buildStageContract writes no email body, no stage arg value and no prior pipeline output into the contract; its context field is a fixed daemon-generated reference naming the pipeline ID and stage index; inputs.trigger keeps type, message_id, from and subject unchanged (from and subject are provenance only and are not read by any daemon code path).'
    - Exactly one function formats the stage payload text (stage args, pipeline output, email body, same capping rules as today's stageContext), and it is called once, for the system prompt, never for the contract. BuildSystemPromptForTools takes the payload through a small struct, appends a STAGE INPUT block after the existing SECURITY paragraph only when the payload is non-empty, and the block names the content as adversarial by reference to SECURITY. BuildSystemPrompt and every existing caller that has no stage payload produce byte-identical output to today.
    - ClaudeRunner.Run threads call.Args, pipe and p.Body into the system-prompt builder at the existing call site; the spawn still passes the prompt file via --append-system-prompt-file and the runner still removes it on return.
    - 'Tests, TDD, each landing in the same commit as the code it proves: (1) in pipeline_test.go, a contract built from a multi-line body longer than maxContractFieldRunes containing an email address and a token-shaped secret contains neither meta.From nor any line of the body; this test fails on the pre-change code. (2) in templates_test.go, a populated payload with tools granted yields a prompt file containing the full capped body, every stage arg and the prior pipeline output verbatim. (3) the same with tools nil and with tools an empty slice. (4) in harness_test.go, TestOnNewMail_EndToEnd additionally asserts the fake spawner''s recorded SystemPromptContent contains the fixture message body, proving the real pipeline delivers it. Existing TestBuildStageContract siblings and TestStageContext tests are updated or relocated to match; TestBuildStageContract_RealEthosCLIRejectsMalformedContract is unchanged and still passes against the real ethos CLI. The test count does not go down.'
    - 'docs/ARCHITECTURE.md Design Invariants gains one bullet: a pipeline stage''s triggering-email content, stage args and prior output never reach a tracked mission-record field and are delivered only through the per-spawn untracked system prompt file; it also states that operator-authored stage text (cmd.Prompt, success_criteria) must never interpolate email-derived content, because those fields are untagged under ethos DES-080 and would be redacted the same way. It cites docs/email-payload-handoff.md (DES-038).'
    - make check is green from the worktree after each commit (the only accepted exception is the known worktree-only gosec G204 artifact whose paths begin with ../ or .claude/worktrees/; any other lint finding is fixed). Commits are one logical step each, fix(daemon) or test(daemon), staged by file name. No t.Skip, no nolint, no suppressions. Do not push, do not touch PRs or merge; the leader does that. Do not commit after submitting.
