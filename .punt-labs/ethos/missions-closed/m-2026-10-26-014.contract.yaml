context: |
    Re-scoped successor to m-2026-10-24-012 (closed failed at its round
    cap) for bead beadle-4gm1, branch fix/email-payload-off-contract,
    worktree [see leader message for the path], HEAD 531272d. The hand-off
    design (docs/email-payload-handoff.md, approach A) and the round-1 and
    round-2 code stand; this mission fixes what the silent-failure hunter
    found on the round-2 fences. The failing finding: Pipeline.Body is
    capped at creation (pipeline.go, Executor.Run) with the marker
    appended, then fenceField sanitizes and caps it again and infers
    truncated from capped != value, so on the production path the header
    says nothing about truncation while the value carries the marker, NULs
    stripped before the second cap produce a double marker, and invalid
    UTF-8 is rewritten at creation with no sanitized state. The pipe value
    has the same stale-state shape: the CLI runner appends the marker and
    fenceField never knows. Design rule for this mission: state is carried
    from the one place that decides it, never inferred downstream from the
    bytes. The nonce is a leader decision, not open: the fence has no
    secret today and the worker has no other way to tell daemon structure
    from sender text. Pipeline JSON gains two bool fields; existing records
    without them unmarshal as false, which is acceptable because they were
    written before fences existed. make test provisions tools itself; never
    run uv tool install or go install by hand. Scratch under the worktree's
    .tmp/ only. One commit per logical step, each green, never more than 30
    minutes uncommitted. If a step needs a file outside the write set, stop
    and report.
