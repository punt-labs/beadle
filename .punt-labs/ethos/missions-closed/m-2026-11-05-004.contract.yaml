success_criteria:
    - 'SYMLINK TOCTOU (HIGH, security): all filesystem access to the repo''s .claude directory in internal/permissions/permissions.go is confined so that a symlink swap of .claude (or of any path component) AFTER the pre-lock check cannot redirect a read or write to a path outside the repo. Use os.Root (Go 1.26, stdlib): open the repo root (or .claude) once with os.OpenRoot, and perform the lock-file open, the settings read, the temp-file create, and the atomic rename through that *os.Root handle (root.OpenFile, root.Open, root.Create, root.Rename, root.Remove, root.Stat/Lstat as available), so every operation is kernel-enforced to stay within the opened directory and refuses symlink traversal. The lock file open MUST also go through the confined handle (Copilot finding on permissions.go:203 / withLock: a symlinked lock currently follows O_CREATE out to ~/.claude). Keep the existing $HOME-is-repo refusal and the pre-existing symlink refusal as a fast preflight, but the guarantee must hold even if the swap happens during the flock wait.'
    - A regression test replaces .claude with a symlink to a separate directory (simulating the swap) and asserts Grant/Revoke either refuse with ErrRefused or operate only within the original repo root, and in NO case read or write the symlink target. A second test swaps the lock path specifically.
    - 'JSON PRECISION (HIGH): read() must not round-trip unrelated settings values through float64. Decode with json.Decoder + UseNumber (keep the existing trailing-input/exactly-one-object validation), or preserve untouched subtrees as json.RawMessage, so an unrelated integer above 2^53 (e.g. 9007199254740993) survives a Grant or Revoke byte-for-byte. Regression test: a settings.json carrying such an integer in an unrelated key is unchanged (except the allow list) after Grant and after Revoke.'
    - 'DISABLE ORDERING (HIGH, enable.go disableLocked): revoke permissions BEFORE clearing the enabled marker and pruning the import, so a failure in marker-removal or import-prune cannot leave a repo visibly disabled while its allow rules remain. A failed prune must not skip revocation. Regression test covers: revoke runs first; a later-step failure does not strand granted rules in an enabled-looking-removed repo.'
    - 'GRANT ORDERING (enable.go enableLocked, Copilot finding enable.go:73): settings refusal checks are a read-only preflight; rules are GRANTED only AFTER successful import registration; if a later enablement step fails, newly added rules are rolled back (revoke only the set this enable added). The existing TestEnableFailedRegisterLeavesNoMarker scenario (a directory at CLAUDE.md) must end with NO allow rules installed and no marker. Extend that test to assert the allow list is empty on that failure path.'
    - 'REVOKE SCOPE (permissions.go Revoke): Revoke must remove only the rules THIS repo''s enable added, not every value matching Rules. If a repo already allowed e.g. Skill(mail) before beadle enable, disable must not delete it. Persist the added set (e.g. a small sidecar under .claude/ or .punt-labs/beadle/ recording what beadle granted, written through the confined root) and revoke exactly that set; Grant already returns the rules it added, so thread that through. Regression test: a repo with a pre-existing beadle-named allow rule keeps it after disable. If the chosen approach changes the on-disk contract, note it in CHANGELOG and in the package doc comment; keep it minimal.'
    - 'DETERMINISTIC WRITE (permissions.go apply, MEDIUM): editing the allow list must not reshuffle unrelated keys or re-escape &, <, > across the whole file. Preserve key order and avoid Go''s default HTML escaping and alphabetical map-key reordering: use a json.Encoder with SetEscapeHTML(false) and preserve object key order (json.RawMessage subtrees for everything except permissions.allow, or an order-preserving approach). Regression test: a settings.json with keys in a non-alphabetical order and a Bash(make && test) rule is byte-stable except for the intended allow-list additions/removals. This criterion and the JSON-precision criterion likely share one implementation (RawMessage preservation) — do that once.'
    - 'STALE COMMENT (enable_tool.go:67-70, LOW): the comment claiming nil progress is passed is wrong — report.printf is now passed to Enable/Disable. Rewrite it to state progress is collected and the settings.json lines are surfaced in the tool result.'
    - 'COMMIT REMINDER (plugin/commands/beadle.md): the /beadle command''s commit reminder must name .claude/settings.json alongside the marker and the CLAUDE.md import, so a user committing enable''s output includes the permission change.'
    - 'CHANGELOG.md: under [Unreleased], document the security fixes (symlink-confinement, JSON precision/stability, revoke scope, ordering) in the existing PL-186 entry or a Fixed/Security subsection.'
    - 'Every commit passes `make check` (lint, lint-strict, vulncheck, docs, tests) with zero suppressions. Save the final `make check` output to a file under .tmp/ and cite it. Note: run make check from the main checkout working dir; if lint-strict reports spurious gosec G204 lines with worktree/../  path prefixes, that is the known nested-worktree artifact, not a finding.'
    - Commit incrementally — one commit per logical step (file group, single concern, or single PR-equivalent slice). Each commit must pass `make check`. Do not accumulate more than 30 minutes of uncommitted changes. Commit only the files you changed (git add <file>, never -A or -a). Do not push, do not touch the PR or merge — the leader does that.
