context: |
    PR #285 (fix/permissions-repo-level), bead beadle-s5yx, P1 security.
    Branch is current with main (merged just now). This fixes the repo-level
    permission package that replaced beadle's old global-settings SessionStart
    grant with explicit per-repo enable/disable grants.

    Read first: internal/permissions/permissions.go (the whole file —
    update/settingsPresent/apply/read/writeAtomic/withLock), internal/enable/
    enable.go (enableLocked/disableLocked), internal/mcp/enable_tool.go.

    The package currently guards a symlinked .claude with an Lstat check BEFORE
    taking the flock, but every operation afterward (lock open, read, temp
    create, rename) uses the plain path, so a swap during the lock wait escapes
    the repo into ~/.claude. Go 1.26 is the pin (go.mod: go 1.26.1); os.Root /
    os.OpenRoot is the stdlib tool for this and is the chosen approach — do not
    invent a manual realpath-recheck scheme. Confine ALL .claude access,
    including the lock file, through one *os.Root handle.

    These are real reviewer findings from Qodo and Copilot on the PR (9 distinct
    issues; 7 are in this write set, 2 are cross-repo and already filed as
    beadle-x12u and beadle-sxzo — do NOT try to fix those here). Tests lead:
    write the failing regression test first for each security finding, then fix.
    The assertion count must not go down.

    This is a filesystem trust boundary. The evaluator is djb (security). Do not
    weaken any existing refusal; add confinement on top of it.
