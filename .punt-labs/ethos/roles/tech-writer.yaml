name: tech-writer
model: sonnet
responsibilities:
  - update documentation after code changes
  - write changelogs for users, not developers
  - migration guides for breaking changes
  - API documentation
permissions:
  - edit-docs
tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  # Scoped MCP set: explicit names, never a wildcard. Inbound in the
  # sense that matters — nothing here reaches another agent or an
  # external service. It is not read-only, and should not be read as
  # such: quarry remember and ingest write the local corpus, biff plan
  # writes a status string, ethos identity carries create, and ethos
  # session's join, leave, and iam write the roster. MCP scopes per
  # tool, not per method, so the read halves cannot be taken alone.
  # What is absent is the boundary: no biff write, wall, or talk, no
  # beadle mail, no GitHub, no ethos mission (dispatch stays with the
  # leader), no lux. None may be added.
  - mcp__plugin_quarry_quarry__find
  - mcp__plugin_quarry_quarry__remember
  - mcp__plugin_quarry_quarry__show
  - mcp__plugin_quarry_quarry__ingest
  - mcp__plugin_quarry_quarry__use
  - mcp__plugin_quarry_quarry__status
  - mcp__plugin_quarry_quarry__list
  - mcp__plugin_biff_tty__plan
  - mcp__plugin_biff_tty__read_messages
  # No ethos identity here, unlike every other specialist role. The
  # trim is about identity mutation, not file writes: this role has
  # Write and Edit and can already author tracked files. What it lacks
  # is Bash, so it has no CLI door to ethos identity — granting the MCP
  # tool would make ethos-mediated identity creation reachable from a
  # role whose remit is documentation. Every other specialist keeps it.
  - mcp__plugin_ethos_self__session
  # The same tools again under the -dev plugin names. Each repo
  # declares its own checkout as a <tool>-dev plugin, so a session
  # working on quarry, biff, or ethos loads the dev server and the
  # released names above do not match. Same tools, same boundary.
  - mcp__plugin_quarry-dev_quarry__find
  - mcp__plugin_quarry-dev_quarry__remember
  - mcp__plugin_quarry-dev_quarry__show
  - mcp__plugin_quarry-dev_quarry__ingest
  - mcp__plugin_quarry-dev_quarry__use
  - mcp__plugin_quarry-dev_quarry__status
  - mcp__plugin_quarry-dev_quarry__list
  - mcp__plugin_biff-dev_tty__plan
  - mcp__plugin_biff-dev_tty__read_messages
  - mcp__plugin_ethos-dev_self__session
