name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install ethos, biff, and beadle-email
        run: make tools-ethos tools-biff tools-beadle-email

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          mkdir -p dist
          for pair in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/beadle-email-${os}-${arch}" ./cmd/beadle-email/
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/beadle-daemon-${os}-${arch}" ./cmd/beadle-daemon/
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum beadle-email-* beadle-daemon-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/beadle-email-*
            dist/beadle-daemon-*
            dist/checksums.txt
