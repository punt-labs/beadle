name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for pair in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/beadle-email-${os}-${arch}" ./cmd/beadle-email/
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum beadle-email-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          generate_release_notes: true
          files: |
            dist/beadle-email-*
            dist/checksums.txt
