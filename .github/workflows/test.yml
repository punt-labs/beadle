name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make staticcheck

      - name: golangci-lint
        run: make lint-strict

      - name: govulncheck
        run: make vulncheck

      - name: ShellCheck
        run: make lint-shell

      - name: Install ethos, biff, and beadle-email
        run: make tools-ethos tools-biff tools-beadle-email

      - name: Add GOPATH/bin and the uv tool bin dir to PATH
        run: |
          printf '%s/bin\n' "$(go env GOPATH)" >> "$GITHUB_PATH"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Test
        run: go test -race -count=1 ./...
