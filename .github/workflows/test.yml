name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make staticcheck

      - name: golangci-lint
        run: make lint-strict

      - name: govulncheck
        run: make vulncheck

      - name: ShellCheck
        run: make lint-shell

      - name: Install ethos, biff, and beadle-email
        run: make tools-ethos tools-biff tools-beadle-email

      - name: Add the per-checkout bin dir, GOPATH/bin, and the uv tool bin dir to PATH
        run: |
          {
            printf '%s/.tmp/bin\n' "$GITHUB_WORKSPACE"
            printf '%s/bin\n' "$(go env GOPATH)"
            uv tool dir --bin
          } >> "$GITHUB_PATH"

      - name: Test
        run: go test -race -count=1 ./...
