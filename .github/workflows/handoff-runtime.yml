name: Handoff runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (handoff-runtime-vN)
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate dispatch
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$TAG" =~ ^handoff-runtime-v[1-9][0-9]*$ ]]; then
            echo "Dispatch on main with a new handoff-runtime-vN tag." >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require an unused tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          refs=$(git ls-remote --refs origin "refs/tags/$TAG")
          if [[ -n "$refs" ]]; then
            echo "Tag $TAG already exists." >&2
            exit 2
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Package runtime
        run: |
          archive=$(make --silent handoff-runtime-bundle)
          mkdir runtime-assets
          asset=beadle-handoff-linux-amd64.tar.gz
          mv "$archive" "runtime-assets/$asset"
          cd runtime-assets
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-runtime
          path: runtime-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdaf643e8b6fd33ac0654aef8333 # v8.0.1
        with:
          name: handoff-runtime
          path: runtime-assets
      - name: Publish versioned asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd runtime-assets
          sha256sum --check ./*.sha256
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Beadle handoff runtime $TAG" --notes-file /dev/null
